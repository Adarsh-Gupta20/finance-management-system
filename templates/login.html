{% extends 'base.html' %}

{% block title %}Login - Personal Finance Manager{% endblock %}

{% block extra_head %}
<style>
    .login-container {
        margin-top: 2rem;
        margin-bottom: 4rem;
    }
    .login-card {
        border: none;
        border-radius: var(--radius);
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
    }
    .login-header {
        background: var(--gradient-primary);
        padding: 2rem;
        text-align: center;
    }
    .login-logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1rem;
    }
    .login-logo i {
        font-size: 2.2rem;
        color: white;
    }
    .login-body {
        padding: 2rem;
    }
    .input-with-icon {
        position: relative;
    }
    .input-with-icon i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--gray);
    }
    .input-with-icon input {
        padding-left: 45px;
    }
    .btn-login {
        padding: 0.8rem;
        font-weight: 600;
        font-size: 1.1rem;
        letter-spacing: 0.5px;
    }
    .separator {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 1.5rem 0;
        color: var(--gray);
    }
    .separator::before, .separator::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #e0e0e0;
    }
    .separator::before {
        margin-right: 0.5rem;
    }
    .separator::after {
        margin-left: 0.5rem;
    }
    .social-login {
        display: flex;
        justify-content: center;
        gap: 1rem;
    }
    .social-login-btn {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        color: white;
        transition: all 0.3s;
    }
    .social-login-btn:hover {
        transform: translateY(-3px);
    }
    .facebook {
        background-color: #3b5998;
    }
    .google {
        background-color: #db4437;
    }
    .twitter {
        background-color: #1da1f2;
    }
</style>
{% endblock %}

{% block content %}
<div class="container login-container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <i class="bi bi-currency-exchange"></i>
                    </div>
                    <h2 class="text-white mb-1">Welcome Back!</h2>
                    <p class="text-white-50 mb-0">Sign in to continue to your dashboard</p>
                </div>
                <div class="login-body">
                    <form method="post" action="{{ url_for('login') }}">
                        <div class="mb-4">
                            <label for="username" class="form-label fw-bold mb-2">Username</label>
                            <div class="input-with-icon">
                                <i class="bi bi-person"></i>
                                <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Enter your username" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="d-flex justify-content-between mb-2">
                                <label for="password" class="form-label fw-bold">Password</label>
                                <a href="#" class="text-primary text-decoration-none small">Forgot password?</a>
                            </div>
                            <div class="input-with-icon">
                                <i class="bi bi-lock"></i>
                                <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter your password" required>
                            </div>
                        </div>
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-primary btn-login">Sign In</button>
                        </div>
                    </form>
                    
                    <div class="separator">or sign in with</div>
                    
                    <div class="social-login mb-4">
                        <a href="#" class="social-login-btn facebook"><i class="bi bi-facebook"></i></a>
                        <a href="#" class="social-login-btn google"><i class="bi bi-google"></i></a>
                        <a href="#" class="social-login-btn twitter"><i class="bi bi-twitter-x"></i></a>
                    </div>
                    
                    <div class="text-center">
                        <p class="mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none">Sign up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
