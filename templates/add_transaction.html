{% extends 'base.html' %}

{% block title %}Add Transaction - Personal Finance Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0"><i class="bi bi-plus-circle me-2"></i>Add Transaction</h3>
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('add_transaction', user_id=user.id) }}">
                    <div class="mb-3">
                        <label class="form-label">Transaction Type</label>
                        <div class="d-flex">
                            <div class="form-check form-check-inline flex-fill">
                                <input class="form-check-input" type="radio" name="type" id="type-income" value="income" checked>
                                <label class="form-check-label" for="type-income">
                                    <i class="bi bi-cash-coin text-success me-1"></i>Income
                                </label>
                            </div>
                            <div class="form-check form-check-inline flex-fill">
                                <input class="form-check-input" type="radio" name="type" id="type-expense" value="expense">
                                <label class="form-check-label" for="type-expense">
                                    <i class="bi bi-credit-card text-danger me-1"></i>Expense
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount ({{ user.preferred_currency }})</label>
                        <div class="input-group">
                            <span class="input-group-text">{{ user.preferred_currency }}</span>
                            <input type="number" step="0.01" min="0.01" class="form-control" id="amount" name="amount" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="category" class="form-label" id="category-label">Category</label>
                        <input type="text" class="form-control" id="category" name="category" list="category-options" required>
                        <datalist id="category-options">
                            <!-- Income categories -->
                            <option value="Salary">Salary</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Business">Business</option>
                            <option value="Investments">Investments</option>
                            <option value="Gifts">Gifts</option>
                            <option value="Other Income">Other Income</option>
                            
                            <!-- Expense categories -->
                            <option value="Food">Food</option>
                            <option value="Housing">Housing</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Education">Education</option>
                            <option value="Personal Care">Personal Care</option>
                            <option value="Travel">Travel</option>
                            <option value="Debt Payments">Debt Payments</option>
                            <option value="Savings">Savings</option>
                            <option value="Gifts & Donations">Gifts & Donations</option>
                            <option value="Other Expenses">Other Expenses</option>
                        </datalist>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="date" name="date" value="{{ today }}" max="{{ today }}" required>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('dashboard', user_id=user.id) }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Transaction</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const typeIncomeRadio = document.getElementById('type-income');
        const typeExpenseRadio = document.getElementById('type-expense');
        const categoryLabel = document.getElementById('category-label');
        
        // Change category label based on selected transaction type
        function updateCategoryLabel() {
            if (typeIncomeRadio.checked) {
                categoryLabel.textContent = 'Income Category';
            } else {
                categoryLabel.textContent = 'Expense Category';
            }
        }
        
        // Initial setup
        updateCategoryLabel();
        
        // Add event listeners
        typeIncomeRadio.addEventListener('change', updateCategoryLabel);
        typeExpenseRadio.addEventListener('change', updateCategoryLabel);
    });
</script>
{% endblock %}
